name: 每日更新双选会数据

on:
  schedule:
    # 每天 08:00（北京时间 = 00:00 UTC）自动抓取 12 所高校官网就业信息
    - cron: '0 0 * * *'
    # 每天 19:00（北京时间 = 11:00 UTC）发送未来 7 天双选会邮件提醒（重点标记明天场次）
    - cron: '0 11 * * *'
  workflow_dispatch:   # 支持在 GitHub Actions 页面手动触发
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装依赖
        run: |
          pip install --quiet requests beautifulsoup4
          pip install --quiet playwright
          python -m playwright install chromium --with-deps

      - name: 抓取 12 所高校双选会
        run: python scripts/fetch_jobfairs.py

      - name: 提交数据更新
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet HEAD -- data/jobfairs.json; then
            echo "数据无变化，跳过提交"
          else
            git add data/jobfairs.json
            git commit -m "chore(data): 每日自动更新双选会信息 $(date +'%Y-%m-%d')"
            git push
          fi

  deploy:
    needs: update
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 配置 Pages
        uses: actions/configure-pages@v5

      - name: 上传站点
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # 每天 19:00（北京时间）发送邮件：未来 7 天双选会 + 明天场次重点标记
  email-report:
    needs: update
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 发送每日邮件提醒
        run: python scripts/send_daily_email.py
        env:
          SMTP_EMAIL: ${{ secrets.SMTP_EMAIL }}
          SMTP_AUTH_CODE: ${{ secrets.SMTP_AUTH_CODE }}
          TO_EMAIL: 1079594841@qq.com
