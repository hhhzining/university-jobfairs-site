name: 每日更新双选会数据

on:
  schedule:
    # 每天 08:00（北京时间 = 00:00 UTC）自动抓取 12 所高校官网就业信息
    # 注意：GitHub 定时任务可能延迟触发（官方机制，非配置错误）；若长时间未更新，
    # 可在 Actions 页面手动 Run workflow 兜底（ref 务必选 main）
    - cron: '0 0 * * *'
    # 每天 19:00（北京时间 = 11:00 UTC）发送未来 7 天双选会邮件提醒（重点标记明天场次）
    - cron: '0 11 * * *'
  workflow_dispatch:   # 支持在 GitHub Actions 页面手动触发
  push:
    branches: [main]
    # 仅前端页面 / 工作流文件变更才触发本流程；
    # 每日 08:00 的抓取脚本自动提交 data/jobfairs.json 时不再触发（避免重复跑部署）
    paths:
      - 'index.html'
      - 'style.css'
      - 'app.js'
      - '.github/workflows/**'

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  update:
    # 只在定时 / 手动触发时抓取数据；纯前端 push 跳过抓取，直接走部署
    if: ${{ github.event_name != 'push' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: data-update
      cancel-in-progress: false
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装依赖
        run: |
          pip install --quiet requests beautifulsoup4
          pip install --quiet playwright
          python -m playwright install chromium --with-deps

      - name: 抓取 12 所高校双选会
        run: python scripts/fetch_jobfairs.py

      - name: 抓取桂林市非校园现场招聘会
        run: python scripts/fetch_guilin_fairs.py

      - name: 提交数据更新
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          changed=0
          for f in data/jobfairs.json data/guilin_fairs.json; do
            if ! git diff --quiet HEAD -- "$f"; then changed=1; fi
          done
          if [ "$changed" = "1" ]; then
            git add data/jobfairs.json data/guilin_fairs.json
            git commit -m "chore(data): 每日自动更新双选会信息 $(date +'%Y-%m-%d')"
            git push
          else
            echo "数据无变化，跳过提交"
          fi

  deploy:
    needs: update
    # update 被跳过（前端 push）或成功时都部署；update 失败则不部署
    # 2026-10-17: 手动触发时请确认 ref 为 main（此前手动触发误用旧版本覆盖了线上数据）
    if: ${{ !cancelled() && !failure() }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # 部署可随时取消重来：连续推送多个 commit 时，旧的部署自动让位给最新
    concurrency:
      group: pages-deploy
      cancel-in-progress: true
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 配置 Pages
        uses: actions/configure-pages@v5

      - name: 上传站点
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # 每天 19:00（北京时间）发送邮件：未来 7 天双选会 + 明天场次重点标记
  email-report:
    needs: update
    # 只在 19:00 的定时触发或手动触发（Actions 页面 Run workflow）时运行；push / 08:00 数据更新不发送
    if: ${{ github.event.schedule == '0 11 * * *' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: data-update
      cancel-in-progress: false
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 发送每日邮件提醒
        run: python scripts/send_daily_email.py
        env:
          SMTP_EMAIL: ${{ secrets.SMTP_EMAIL }}
          SMTP_AUTH_CODE: ${{ secrets.SMTP_AUTH_CODE }}
          TO_EMAIL: 1079594841@qq.com
